[package]
name = "av-core"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "av-core"
path = "src/main.rs"

[lib]
name = "av_core_lib"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
walkdir = "2"
rayon = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
goblin = { version = "0.8", default-features = false, features = ["pe32"] }
