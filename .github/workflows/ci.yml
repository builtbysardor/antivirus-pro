name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  rust:
    name: Rust (test + clippy + audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: cargo test
        run: cargo test --manifest-path core/Cargo.toml
      - name: cargo clippy
        run: cargo clippy --manifest-path core/Cargo.toml -- -D warnings
      - name: cargo audit
        run: |
          cargo install cargo-audit --quiet
          cargo audit --manifest-path core/Cargo.toml

  backend:
    name: Python (lint + security)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r backend/requirements.txt ruff bandit pytest pytest-asyncio httpx
      - name: ruff lint
        run: ruff check backend/
      - name: bandit security scan
        run: bandit -r backend/ -ll

  frontend:
    name: Node.js (build + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: cd frontend && npm ci
      - name: Build
        run: cd frontend && npm run build
      - name: npm audit
        run: cd frontend && npm audit --audit-level=high || true
